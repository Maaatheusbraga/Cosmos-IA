<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmos | Data Voyager</title>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg-color: #020406; 
            --primary: #7D5FFF;
            --secondary: #00ffaa;
            --text-main: #E6E6E6;
            --card-bg: rgba(70, 72, 78, 0.884);
        }

        /* --- FUNDO ESTELAR DINÂMICO --- */
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            background-image: 
                radial-gradient(1px 1px at 10px 10px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 150px 100px, #7D5FFF, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 250px 280px, #00FFD1, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 350px 80px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 400px 400px;
            animation: cosmosTravel 180s linear infinite;
        }

        @keyframes cosmosTravel {
            from { background-position: 0 0; }
            to { background-position: 350px 1000px; }
        }

        .brand-header { text-align: center; z-index: 10; margin-bottom: 25px; }
        .brand-header h1 { 
            font-size: 2rem; 
            background: linear-gradient(to right, var(--secondary), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            letter-spacing: 8px;
            font-weight: 900;
        }

        /* --- CONTAINER DE CHAT --- */
        #chat-container { 
            width: 100%;
            max-width: 550px;
            flex-grow: 1; 
            overflow-y: auto; 
            margin-bottom: 20px;
            padding: 20px; 
            background: var(--card-bg);
            border-radius: 25px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        /* --- ESTILIZAÇÃO MENSAGENS & MARKDOWN --- */
        .msg { padding: 12px 18px; border-radius: 16px; max-width: 85%; font-size: 0.85rem; line-height: 1.5; }
        .user { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 2px; }
        .ai { align-self: flex-start; background: rgba(0, 0, 0, 0.25); border-left: 2px solid var(--secondary); border-bottom-left-radius: 2px; }

        /* Estilos específicos para o conteúdo gerado pelo Markdown */
        .msg.ai ul, .msg.ai ol { padding-left: 20px; margin: 10px 0; }
        .msg.ai code { background: rgba(255, 255, 255, 0.1); padding: 2px 5px; border-radius: 4px; font-family: monospace; }
        .msg.ai pre { background: #000; padding: 10px; border-radius: 8px; overflow-x: auto; border: 1px solid var(--secondary); margin: 10px 0; }

        .input-box { 
            width: 100%;
            max-width: 550px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            z-index: 10;
        }
        
        textarea { width: 100%; height: 45px; border: none; background: transparent; color: white; outline: none; resize: none; font-size: 0.9rem; }
        .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .btn { padding: 8px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.75rem; transition: 0.3s; }
        #sendBtn { background: var(--secondary); color: #030508; }
        #clearBtn { background: var(--primary); color: #ffffff; }

        #chat-container::-webkit-scrollbar { width: 4px; }
        #chat-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="brand-header">
        <h1>COSMOS</h1>
    </div>
    
    <div id="chat-container">
        <div class="msg ai"><b>Cosmos:</b> Sincronizando personalidade estelar...</div>
    </div>

    <div class="input-box">
        <textarea id="prompt" placeholder="Sondar o cosmos..."></textarea>
        <div class="actions">
            <button id="clearBtn" class="btn">RESET</button>
            <button id="sendBtn" class="btn" disabled>AGUARDE...</button>
        </div>
    </div>

    <script>
        const API_KEY = "AIzaSyDvCVZZnQMR5I0rjXqX3vtd0_qu9K01aSc"; 
        const MODELO = "gemini-3-flash-preview"; //
        let historico = [];
        let instrucaoSistema = "";

        const promptInput = document.getElementById('prompt');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const chatContainer = document.getElementById('chat-container');

        // Carregar personalidade do arquivo TXT externo
        async function carregarPersonalidade() {
            try {
                const response = await fetch('personalidade.txt');
                if (!response.ok) throw new Error("Falha no arquivo");
                instrucaoSistema = await response.text();
                
                sendBtn.disabled = false;
                sendBtn.innerText = "ENVIAR";
                chatContainer.innerHTML = `<div class="msg ai"><b>Cosmos:</b> Personalidade carregada. Todos os sistemas estão em órbita.</div>`;
            } catch (err) {
                console.error(err);
                instrucaoSistema = "Você é o Cosmos, um guia de tecnologia.";
                sendBtn.disabled = false;
                sendBtn.innerText = "ENVIAR";
            }
        }

        carregarPersonalidade();

        // Função de renderização com suporte a Markdown
        function adicionarMensagem(texto, remetente) {
            const div = document.createElement('div');
            div.className = `msg ${remetente}`;
            
            if (remetente === 'ai') {
                // Usa a biblioteca Marked para converter Markdown em HTML
                div.innerHTML = `<b>Cosmos:</b><br>${marked.parse(texto)}`;
            } else {
                div.innerText = `Você: ${texto}`;
            }
            
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        sendBtn.addEventListener('click', async () => {
            const userMsg = promptInput.value.trim();
            if (!userMsg) return;

            adicionarMensagem(userMsg, 'user');
            historico.push({ role: "user", parts: [{ text: userMsg }] }); //
            promptInput.value = "";
            sendBtn.disabled = true;

            const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODELO}:generateContent?key=${API_KEY}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: instrucaoSistema }] }, //
                        contents: historico, //
                        generationConfig: { temperature: 0.7 }
                    })
                });

                const data = await response.json();
                const aiMsg = data.candidates[0].content.parts[0].text; //

                historico.push({ role: "model", parts: [{ text: aiMsg }] }); //
                adicionarMensagem(aiMsg, 'ai');

            } catch (err) {
                adicionarMensagem("Erro: Falha na telemetria estelar.", 'ai');
            } finally {
                sendBtn.disabled = false;
            }
        });

        clearBtn.addEventListener('click', () => {
            historico = [];
            chatContainer.innerHTML = `<div class="msg ai"><b>Cosmos:</b> Histórico limpo. Pronto para nova jornada.</div>`;
        });

        promptInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });
    </script>
</body>
</html>
