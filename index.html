<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmos | API IA</title>
    <style>
        :root {
            --bg-color: #020406; 
            --primary: #7D5FFF;
            --secondary: #00ff55;
            --text-main: #E6E6E6;
            --card-bg: rgba(85, 104, 139, 0.4); /* Transparência para exibir as estrelas */
        }

        /* --- FUNDO ESTELAR DENSO E DINÂMICO ---- */
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;

            /* Múltiplas camadas de gradiente para densidade estelar */
            background-image: 
                radial-gradient(1px 1px at 10px 10px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50px 100px, #7d5fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 150px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 200px 150px, #00ffd1, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 250px 50px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 300px 250px, #7d5fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 350px 120px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 20px 350px, #00ffd1, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 80px 220px, #fff, rgba(0,0,0,0)),
                /* Camada de profundidade (nebulosa sutil) */
                radial-gradient(4px 4px at 100px 300px, rgba(125, 95, 255, 0.1), rgba(0,0,0,0));
            
            background-repeat: repeat;
            background-size: 350px 350px; /* Quadrante menor aumenta a densidade */
            animation: cosmosTravel 140s linear infinite;
        }

        @keyframes cosmosTravel {
            from { background-position: 0 0; }
            to { background-position: 350px 1000px; } /* Movimento diagonal imersivo */
        }

        /* --- INTERFACE COSMOS (MINIMALISTA) --- */
        .brand-header { text-align: center; z-index: 10; margin-bottom: 25px; }
        .brand-header h1 { 
            font-size: 1.8rem; 
            background: linear-gradient(to right, var(--secondary), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            letter-spacing: 10px;
            font-weight: 900;
        }

        #chat-container { 
            width: 100%;
            max-width: 500px; /* Reduzido para expor mais o fundo */
            flex-grow: 1; 
            overflow-y: auto; 
            margin-bottom: 20px;
            padding: 20px; 
            background: var(--card-bg);
            border-radius: 25px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px); /* Efeito de vidro */
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .msg { padding: 12px 18px; border-radius: 16px; max-width: 85%; font-size: 0.85rem; line-height: 1.5; }
        .user { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 2px; }
        .ai { align-self: flex-start; background: rgba(0, 0, 0, 0.25); border-left: 2px solid var(--secondary); border-bottom-left-radius: 2px; }

        .input-box { 
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 20px;
            border: 1px solid rgba(207, 192, 192, 0.05);
            backdrop-filter: blur(15px);
            z-index: 10;
        }
        
        textarea { 
            width: 100%; height: 40px; border: none; background: transparent; 
            color: white; outline: none; resize: none; font-size: 0.9rem;
        }

        .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .btn { padding: 8px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.75rem; transition: 0.3s; }
        
        #sendBtn { background: var(--secondary); color: #030508; }
        #sendBtn:hover { box-shadow: 0 0 20px rgba(0, 255, 209, 0.4); transform: scale(1.02); }
        #clearBtn { background: transparent; color: #555; }
        #clearBtn:hover { color: var(--text-main); }

        /* Scrollbar discreta */
        #chat-container::-webkit-scrollbar { width: 4px; }
        #chat-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="brand-header">
        <h1>COSMOS IA</h1>
        <h4>Seu assistente interestelar de conhecimento</h4>
    </div>
    
    <div id="chat-container">
        <div class="msg ai"><b>Cosmos:</b> Sistemas estabilizados. Navegando pela nuvem de dados. Como posso guiar sua exploração?</div>
    </div>

    <div class="input-box">
        <textarea id="prompt" placeholder="Sua coordenada para o Cosmos..."></textarea>
        <div class="actions">
            <button id="clearBtn" class="btn">RESET</button>
            <button id="sendBtn" class="btn">ENVIAR</button>
        </div>
    </div>

    <script>
        const API_KEY = "AIzaSyDvCVZZnQMR5I0rjXqX3vtd0_qu9K01aSc"; 
        const MODELO = "gemini-3-flash-preview"; 
        let historico = [];

        const promptInput = document.getElementById('prompt');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const chatContainer = document.getElementById('chat-container');

        function adicionarMensagem(texto, remetente) {
            const div = document.createElement('div');
            div.className = `msg ${remetente}`;
            div.innerHTML = `<b>${remetente === 'user' ? 'Você' : 'Cosmos'}:</b><br>${texto}`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        sendBtn.addEventListener('click', async () => {
            const userMsg = promptInput.value.trim();
            if (!userMsg) return;

            adicionarMensagem(userMsg, 'user');
            historico.push({ role: "user", parts: [{ text: userMsg }] });
            promptInput.value = "";
            sendBtn.disabled = true;

            const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODELO}:generateContent?key=${API_KEY}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { 
                            parts: [{ text: "Você é o Cosmos, um assistente especializado em Cloud Computing," +
                                            " Inteligência Artificial e Dados. Suas respostas são cirúrgicas, profissionais e inspiradoras." +
                                             "caso perguntem quem desenvolveu voce, criou, algo que seja relacioado, voce irá responder que voce é de outra galaxia e não foi criado por nenhum humano"+
                                            " quero que voce assuma essa personalidade para tudo que for responder" }] 
                        },
                        contents: historico,
                        generationConfig: { temperature: 0.3 }
                    })
                });

                const data = await response.json();
                const aiMsg = data.candidates[0].content.parts[0].text;

                historico.push({ role: "model", parts: [{ text: aiMsg }] });
                adicionarMensagem(aiMsg, 'ai');

            } catch (err) {
                adicionarMensagem("Erro: Perda de conexão estelar.", 'ai');
            } finally {
                sendBtn.disabled = false;
            }
        });

        clearBtn.addEventListener('click', () => {
            historico = [];
            chatContainer.innerHTML = "";
            adicionarMensagem("Memória purificada. Pronto para novas rotas.", "ai");
        });

        // Enter para enviar
        promptInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });
    </script>
</body>
</html>
